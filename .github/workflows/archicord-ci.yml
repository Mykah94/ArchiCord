name: ArchiCord CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Check for committed local secrets and seed files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import PurePosixPath
          import subprocess

          files = subprocess.check_output(['git', 'ls-files', '-z']).decode('utf-8').split('\0')
          forbidden = []
          for name in filter(None, files):
              path = PurePosixPath(name)
              pieces = path.parts
              base = path.name.lower()
              if base == '.env' or (base.startswith('.env.') and base != '.env.example'):
                  forbidden.append(name)
              elif base.endswith(('.pem', '.p12', '.pfx', '.key', '.apworld', '.archipelago')):
                  forbidden.append(name)
              elif base.startswith('ap_') and base.endswith('.zip'):
                  forbidden.append(name)
              elif pieces[0] in ('archicord_data', 'deathlinks'):
                  forbidden.append(name)
              elif len(pieces) >= 2 and pieces[0] == 'tracker' and pieces[1] in ('seeds', 'yamls', 'apworlds') and base != '.gitkeep':
                  forbidden.append(name)
          if forbidden:
              raise SystemExit('Private files committed; remove before merging:\n' + '\n'.join(forbidden))
          print('No known local secrets or seed files in the tracked repository.')
          PY

      - name: Check Python syntax
        run: |
          python - <<'PY'
          import subprocess
          paths = subprocess.check_output(['git', 'ls-files', '-z', '*.py']).decode('utf-8').split('\0')
          for path in filter(None, paths):
              with open(path, 'rb') as f:
                  compile(f.read(), path, 'exec')
          print(f'Compiled {sum(bool(p) for p in paths)} tracked Python files.')
          PY

      - name: Validate embedded WebUI JavaScript
        run: |
          python - <<'PY'
          import re
          import subprocess
          import tempfile
          from pathlib import Path
          import webui
          from archicord_dashboard import render_dashboard
          from tracker.instances_webui import render_instances
          from tracker.obs_log_webui import render_obs_log
          from tracker.tracker_ui import render as tracker_page
          from tracker.room_checks_webui import render as checks_page
          import overlay_studio

          pages = {
              'control': webui.HTML,
              'apworlds': webui.APWORLD_HTML,
              'resources': webui.RESOURCES_HTML,
              'dashboard': render_dashboard('dashboard', webui.BASE_STYLE, 'test-csrf'),
              'notifications': render_dashboard('notifications', webui.BASE_STYLE, 'test-csrf'),
              'multiworlds': render_instances(webui.BASE_STYLE, 'test-csrf'),
              'obs-log': render_obs_log('room1'),
              'tracker': tracker_page(webui.BASE_STYLE,'test-csrf'),
              'room-checks': checks_page(webui.BASE_STYLE,'room1'),
              'overlay-studio': overlay_studio.STUDIO.replace('__CSS__',overlay_studio.CSS).replace('__TOKEN__','"test-token"'),
              'overlay-source': overlay_studio.OBS.replace('__PROFILE__','"default"'),
          }
          with tempfile.TemporaryDirectory() as tmp:
              for name, page in pages.items():
                  for number, code in enumerate(re.findall(r'<script[^>]*>(.*?)</script>', page, re.S)):
                      path = Path(tmp) / f'{name}-{number}.js'
                      path.write_text(code, encoding='utf-8')
                      subprocess.run(['node', '--check', str(path)], check=True)
          print('WebUI JavaScript parsed successfully.')
          PY

      - name: Compile Python entry points and desktop utilities
        run: python -m compileall -q archicord.py webui.py overlay_studio.py overlay_desktop.py screen_notifications.py overlay_sounds.py env_migration.py tracker

      - name: Run tests
        run: python -m pytest -q

  windows-credential-store:
    name: Windows Credential Manager
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Test real user-scoped Windows Credential Manager
        run: python -m pytest -q tests/test_discord_credential_store.py
